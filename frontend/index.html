    <noscript>
      <main style="max-width: 560px; margin: 40px auto; padding: 0 20px; font-family: system-ui, sans-serif; line-height: 1.5">
        <h1>Smart Working Manager</h1>
        <p>
          Smart Working Manager ti aiuta a rispettare la policy di presenza in ufficio della tua
          azienda: registri le giornate in ufficio, in smart working, ferie, permessi, malattia e
          trasferta, e vedi a che punto sei rispetto all'obiettivo.
        </p>
        <ul>
          <li>Nessuna registrazione: parti subito con un nickname e un codice di recupero personale.</li>
          <li>Policy a percentuale o a giorni fissi a settimana, con data di inizio e scadenza.</li>
          <li>Dashboard con giorni richiesti, fatti e rimanenti, e semaforo di andamento.</li>
          <li>Calendario annuale e simulazione di scenari futuri.</li>
        </ul>
        <p>Per usare l'app è necessario abilitare JavaScript nel browser.</p>
      </main>
    </noscript>
